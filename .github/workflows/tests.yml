name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ${{ matrix.os || 'ubuntu-latest' }}

    # A passing suite finishes well inside this on Linux; anything approaching
    # it is a hang, and failing fast is cheaper than burning runner time.
    # Starting processes is several times slower on Windows, and the suite
    # starts a great many (git, PHP, Rector), hence its larger budget.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 45 || 15 }}

    # One shell everywhere, so the multi-line steps below mean the same thing
    # on the Windows leg as on the Linux ones.
    defaults:
      run:
        shell: bash

    strategy:
      fail-fast: false
      matrix:
        # Laravel and Testbench move together -- Testbench 10 targets Laravel 12,
        # 11 targets 13 -- so the pair is pinned per leg rather than left as two
        # free axes that would resolve to impossible cells.
        #
        # Laravel 11 is deliberately absent. Its security window has closed, so
        # every 11.x release now carries advisories that will never be patched,
        # and Composer's advisory policy refuses to install any of them. A leg
        # that cannot install is not a supported version.
        #
        # `highest` is the install most users get. `lowest` is run on the two ends
        # of the supported range only: it exists to catch a constraint in
        # composer.json that is wider than the code actually supports, and that
        # answer does not change in the middle of the range.
        include:
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
            dependencies: lowest
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
            dependencies: highest
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
            dependencies: highest
          - php: '8.3'
            laravel: '13.*'
            testbench: '11.*'
            dependencies: highest
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'
            dependencies: highest
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'
            dependencies: lowest
          # The newest PHP the package supports, so a deprecation there shows
          # up here before a user reports it.
          - php: '8.5'
            laravel: '13.*'
            testbench: '11.*'
            dependencies: highest
          # Paths, line endings and process spawning all differ on Windows,
          # and Sloppy shells out to git, Rector and Pint. Coverage is left to
          # the Linux legs: the threshold would only measure the same code
          # again, more slowly.
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'
            dependencies: highest
            os: windows-latest

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.dependencies }}${{ matrix.os && format(' · {0}', matrix.os) || '' }}

    steps:
      # Fixtures and expected output are compared byte for byte; a CRLF
      # checkout would fail them for reasons that have nothing to do with the
      # code under test.
      - name: Keep line endings as committed
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false

      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, sqlite3, pdo_sqlite
          # PCOV is many times faster than Xdebug for the line coverage that
          # --min=99 needs, and line coverage is all it needs.
          coverage: ${{ matrix.os == 'windows-latest' && 'none' || 'pcov' }}

      - name: Constrain Laravel and Testbench
        # `--dev` on the illuminate packages is load-bearing. They are dev
        # dependencies now that the package ships a standalone binary, and a
        # bare `composer require` would write them back into `require` -- which
        # is exactly what tests/Unit/Cli/ComposerManifestTest.php fails on.
        run: |
          composer require --dev --no-update --no-interaction \
            "illuminate/console:${{ matrix.laravel }}" \
            "illuminate/contracts:${{ matrix.laravel }}" \
            "illuminate/support:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}"

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Tests
        if: runner.os != 'Windows'
        run: vendor/bin/pest --colors=always --coverage --min=99

      - name: Tests (no coverage)
        if: runner.os == 'Windows'
        run: vendor/bin/pest --colors=always

  quality:
    runs-on: ubuntu-latest
    name: Lint, static analysis and types

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, sqlite3, pdo_sqlite
          coverage: pcov

      # Before anything is installed, so a malformed manifest fails here with
      # Composer's own explanation. composer.lock is not committed, so there
      # is no lock to check against.
      - name: Validate composer.json
        run: composer validate --strict --no-check-lock

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      # Runtime dependencies only: they are what a user installs. Advisories
      # in the dev tree (Laravel's, Testbench's) do not reach anyone's
      # production and are not this package's to patch.
      - name: Audit runtime dependencies
        run: composer audit --no-dev

      - name: Rector
        run: vendor/bin/rector --dry-run --no-progress-bar

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      # The type-coverage plugin analyses files in forked workers that all
      # persist into one cache file, .temp/v3.php inside the plugin. Its lock
      # gives up after 100ms and writes anyway, so on a loaded runner two
      # workers interleave into that file and the next include of it is a
      # parse error in vendor, unrelated to this project's code. The plugin's
      # own flag keeps the analysis in a single process, which only changes
      # how the files are chunked -- every file is still analysed -- and the
      # cache buys nothing on a checkout that installs from scratch.
      #
      # variables_order is set because $_ENV, which the plugin reads, is not
      # populated from the environment under the default GPCS.
      - name: Type coverage
        env:
          __PEST_PLUGIN_ENV: '1'
        run: php -d variables_order=EGPCS vendor/bin/pest --type-coverage --min=100

  # What a user gets from `composer require heyosseus/sloppy` in a project
  # that is not Laravel: no illuminate packages, no Pest, no Rector. Every
  # other job installs the dev tree, so a runtime class that quietly depends on
  # a dev package would pass them all and fail here.
  runtime:
    runs-on: ubuntu-latest
    name: Runtime install (--no-dev)

    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          # The lowest supported PHP, and nothing beyond setup-php's defaults.
          php-version: '8.3'
          coverage: none

      - name: Install runtime dependencies only
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      # A smoke test, not a quality gate: SelfCheckTest holds the source to
      # its own rules. This proves the binary boots and analyses without dev
      # packages.
      - name: Scan the package's own source
        run: php bin/sloppy scan --path=src --fail-on=never

      - name: Round-trip the MCP server
        run: |
          RESPONSE="$(printf '%s\n%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            | php bin/sloppy-mcp)"
          echo "$RESPONSE"
          echo "$RESPONSE" | grep -q '"serverInfo":{"name":"sloppy"'
          echo "$RESPONSE" | grep -q '"name":"sloppy_scan"'

  # The phar is built only when a tag is pushed, which is the worst moment to
  # learn it no longer builds or no longer runs. This builds it the way
  # release.yml does on every pull request and exercises the commands that
  # load the most of the package: a Rector config and a fix pass.
  phar:
    runs-on: ubuntu-latest
    name: PHAR build

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, intl
          ini-values: phar.readonly=0
          tools: box
          coverage: none

      - name: Install runtime dependencies only
        run: composer install --no-dev --prefer-dist --no-interaction --no-progress

      # See release.yml: Box's own class-map generator misses enums.
      - name: Dump the autoloader Composer's way
        run: composer dump-autoload --classmap-authoritative --no-dev --no-interaction

      - name: Compile
        run: box compile --no-parallel

      - name: Run the phar against a small project
        run: |
          php sloppy.phar --version
          php sloppy.phar scan --project=tests/Fixtures/Vanilla --format=rector --fail-on=never > rector-sloppy.php
          php -l rector-sloppy.php
          php sloppy.phar fix --project=tests/Fixtures/Vanilla --dry-run --no-pint
