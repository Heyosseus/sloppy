name: tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    # A passing suite finishes in a couple of minutes; anything approaching this
    # is a hang, and failing fast is cheaper than burning runner time.
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        # Laravel and Testbench move together -- Testbench 10 targets Laravel 12,
        # 11 targets 13 -- so the pair is pinned per leg rather than left as two
        # free axes that would resolve to impossible cells.
        #
        # Laravel 11 is deliberately absent. Its security window has closed, so
        # every 11.x release now carries advisories that will never be patched,
        # and Composer's advisory policy refuses to install any of them. A leg
        # that cannot install is not a supported version.
        #
        # `highest` is the install most users get. `lowest` is run on the two ends
        # of the supported range only: it exists to catch a constraint in
        # composer.json that is wider than the code actually supports, and that
        # answer does not change in the middle of the range.
        include:
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
            dependencies: lowest
          - php: '8.3'
            laravel: '12.*'
            testbench: '10.*'
            dependencies: highest
          - php: '8.4'
            laravel: '12.*'
            testbench: '10.*'
            dependencies: highest
          - php: '8.3'
            laravel: '13.*'
            testbench: '11.*'
            dependencies: highest
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'
            dependencies: highest
          - php: '8.4'
            laravel: '13.*'
            testbench: '11.*'
            dependencies: lowest

    name: PHP ${{ matrix.php }} · Laravel ${{ matrix.laravel }} · ${{ matrix.dependencies }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, intl, sqlite3, pdo_sqlite
          # PCOV is many times faster than Xdebug for the line coverage that
          # --min=95 needs, and line coverage is all it needs.
          coverage: pcov

      - name: Constrain Laravel and Testbench
        # `--dev` on the illuminate packages is load-bearing. They are dev
        # dependencies now that the package ships a standalone binary, and a
        # bare `composer require` would write them back into `require` -- which
        # is exactly what tests/Unit/Cli/ComposerManifestTest.php fails on.
        run: |
          composer require --dev --no-update --no-interaction \
            "illuminate/console:${{ matrix.laravel }}" \
            "illuminate/contracts:${{ matrix.laravel }}" \
            "illuminate/support:${{ matrix.laravel }}" \
            "orchestra/testbench:${{ matrix.testbench }}"

      - name: Install dependencies
        uses: ramsey/composer-install@v3
        with:
          dependency-versions: ${{ matrix.dependencies }}

      - name: Tests
        run: vendor/bin/pest --colors=always --coverage --min=99

  quality:
    runs-on: ubuntu-latest
    name: Lint, static analysis and types

    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, intl, sqlite3, pdo_sqlite
          coverage: pcov

      - name: Install dependencies
        uses: ramsey/composer-install@v3

      - name: Rector
        run: vendor/bin/rector --dry-run --no-progress-bar

      - name: Pint
        run: vendor/bin/pint --test

      - name: PHPStan
        run: vendor/bin/phpstan analyse --no-progress --memory-limit=512M

      # The type-coverage plugin analyses files in forked workers that all
      # persist into one cache file, .temp/v3.php inside the plugin. Its lock
      # gives up after 100ms and writes anyway, so on a loaded runner two
      # workers interleave into that file and the next include of it is a
      # parse error in vendor, unrelated to this project's code. The plugin's
      # own flag keeps the analysis in a single process, which only changes
      # how the files are chunked -- every file is still analysed -- and the
      # cache buys nothing on a checkout that installs from scratch.
      #
      # variables_order is set because $_ENV, which the plugin reads, is not
      # populated from the environment under the default GPCS.
      - name: Type coverage
        env:
          __PEST_PLUGIN_ENV: '1'
        run: php -d variables_order=EGPCS vendor/bin/pest --type-coverage --min=100
