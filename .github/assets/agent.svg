<svg xmlns="http://www.w3.org/2000/svg" width="780" height="378" viewBox="0 0 780 378" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;DejaVu Sans Mono&quot;, monospace">
  <defs>
    <linearGradient id="chrome" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f2530"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
  </defs>
  <rect x="0.5" y="0.5" width="779" height="377" rx="12" fill="#0d1117" stroke="#30363d"/>
  <path d="M0.5 12.5a12 12 0 0 1 12-12h755 a12 12 0 0 1 12 12V38H0.5z" fill="url(#chrome)"/>
  <line x1="0.5" y1="38" x2="779.5" y2="38" stroke="#30363d"/>
  <circle cx="22" cy="19.5" r="5.5" fill="#ec6a5f"/>
  <circle cx="41" cy="19.5" r="5.5" fill="#f4bf50"/>
  <circle cx="60" cy="19.5" r="5.5" fill="#61c454"/>
  <text x="390" y="24" fill="#7d8590" font-size="12" text-anchor="middle">What Claude Code runs after the agent edits a PHP file</text>
  <text x="26" y="62" font-size="13" xml:space="preserve"><tspan fill="#94d3a2">$ </tspan><tspan fill="#c9d1d9">vendor/bin/sloppy hook post-edit &lt; edit.json</tspan></text>
  <text x="26" y="102" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9" font-weight="600">Sloppy:</tspan><tspan fill="#c9d1d9"> this edit to app/Services/InvoiceMailer.php introduced 1 finding.</tspan></text>
  <text x="26" y="142" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">- </tspan><tspan fill="#6cb6ff">app/Services/InvoiceMailer.php:15</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#f47067" font-weight="600">SL107</tspan><tspan fill="#c9d1d9"> Swallowed Exception </tspan><tspan fill="#f47067">(high)</tspan><tspan fill="#c9d1d9">:</tspan></text>
  <text x="26" y="162" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">  InvoiceMailer::send() catches Throwable and does nothing at all.</tspan></text>
  <text x="26" y="182" font-size="13" xml:space="preserve"><tspan fill="#94d3a2" font-weight="600">  Fix: </tspan><tspan fill="#7d8590">Do at least one of: log or report the exception, rethrow it wrapped in a</tspan></text>
  <text x="26" y="202" font-size="13" xml:space="preserve"><tspan fill="#7d8590">       domain-specific type, or return a result the caller can distinguish from success. If</tspan></text>
  <text x="26" y="222" font-size="13" xml:space="preserve"><tspan fill="#7d8590">       the failure genuinely is expected and unremarkable, say so in a comment so the next</tspan></text>
  <text x="26" y="242" font-size="13" xml:space="preserve"><tspan fill="#7d8590">       reader knows it was a decision.</tspan></text>
  <text x="26" y="282" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">Fix these while the code is in front of you. If one is deliberate, say why in your reply.</tspan></text>
  <text x="26" y="322" font-size="13" xml:space="preserve"><tspan fill="#94d3a2">$ </tspan><tspan fill="#c9d1d9">echo $?</tspan></text>
  <text x="26" y="342" font-size="13" xml:space="preserve"><tspan fill="#f47067" font-weight="600">2</tspan><tspan fill="#7d8590">    ← Claude Code hands standard error back to the model</tspan></text>
</svg>
