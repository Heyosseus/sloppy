  <text x="408.5" y="24" fill="#7d8590" font-size="12" text-anchor="middle">vendor/bin/sloppy scan --top=2</text>
  <text x="26" y="62" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="600">Sloppy</tspan></text>
  <text x="26" y="102" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">  Score  </tspan><tspan fill="#e57373" font-weight="600">0/100</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#e57373">Severe slop</tspan></text>
  <text x="26" y="122" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">  Files  14 analysed  ·  405 lines  ·  31 findings</tspan></text>
  <text x="26" y="162" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="600">Fix first</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8590">6 defects in 4 places, highest risk first -- the first 2</tspan></text>
  <text x="26" y="202" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e57373" font-weight="600">HIGH    </tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#c9d1d9" font-weight="600">SL112</tspan><tspan fill="#c9d1d9">  Placeholder Implementation  </tspan><tspan fill="#7d8590">(92% confidence)</tspan></text>
  <text x="26" y="222" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">         </tspan><tspan fill="#d6dae2" font-weight="600">Sloppy/RefundProcessor.php:11</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8590">and 2 more in this file (lines 16, 21)</tspan></text>
  <text x="26" y="242" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">         RefundProcessor::refund() has code elided by a "... existing code ..." comment.</tspan></text>
  <text x="26" y="262" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">         </tspan><tspan fill="#56d4dd">→ </tspan><tspan fill="#c9d1d9">Write out the code the comment stands for, or restore it from version control. If</tspan></text>
  <text x="26" y="282" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">           the body really is meant to be shorter, delete the comment.</tspan></text>
  <text x="26" y="322" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e57373" font-weight="600">HIGH    </tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#c9d1d9" font-weight="600">SL107</tspan><tspan fill="#c9d1d9">  Swallowed Exception  </tspan><tspan fill="#7d8590">(84% confidence)</tspan></text>
  <text x="26" y="342" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">         </tspan><tspan fill="#d6dae2" font-weight="600">Sloppy/OrderController.php:77:27</tspan></text>
  <text x="26" y="362" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">         OrderController::store() catches Throwable and returns without recording the</tspan></text>
  <text x="26" y="382" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">         failure.</tspan></text>
  <text x="26" y="402" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">         </tspan><tspan fill="#56d4dd">→ </tspan><tspan fill="#c9d1d9">Do at least one of: log or report the exception, rethrow it wrapped in a</tspan></text>
  <text x="26" y="422" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">           domain-specific type, or return a result the caller can distinguish from success. If</tspan></text>
  <text x="26" y="442" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">           the failure genuinely is expected and unremarkable, say so in a comment so the next</tspan></text>
  <text x="26" y="462" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">           reader knows it was a decision.</tspan></text>
  <text x="26" y="502" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="600">Hotspots</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8590">18 maintainability findings in 4 files, summarised -- the 4 most worth a look</tspan></text>
  <text x="26" y="542" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#d6dae2" font-weight="600">Sloppy/OrderController.php</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8590">1 change in recent history</tspan></text>
  <text x="26" y="562" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">         4 × Unused Constructor Dependency · 1 × Defensive Programming Noise</tspan></text>
  <text x="26" y="582" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">         1 × Excessive Nesting · 1 × God Method · 1 × Narrative Comment</tspan></text>
  <text x="26" y="622" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#d6dae2" font-weight="600">Sloppy/Drift/GatewayFamily.php</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8590">1 change in recent history</tspan></text>
  <text x="26" y="642" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">         3 × Duplicate Logic · 1 × Copy-Paste Drift</tspan></text>
  <text x="26" y="682" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#d6dae2" font-weight="600">Sloppy/ReportingService.php</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8590">2 changes in recent history</tspan></text>
  <text x="26" y="702" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">         2 × Duplicate Logic · 1 × Defensive Programming Noise · 1 × Redundant Condition</tspan></text>
  <text x="26" y="722" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">         1 × Unused Constructor Dependency</tspan></text>
  <text x="26" y="762" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#d6dae2" font-weight="600">Sloppy/Drift/RefundTbcPayment.php</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8590">1 change in recent history</tspan></text>
  <text x="26" y="782" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">         1 × Copy-Paste Drift</tspan></text>
  <text x="26" y="822" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="600">By rule</tspan></text>
  <text x="26" y="862" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">    SL104  Duplicate Logic                           5  </tspan><tspan fill="#7d8590">maintainability</tspan></text>
  <text x="26" y="882" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">    SL106  Unused Constructor Dependency             5  </tspan><tspan fill="#7d8590">maintainability</tspan></text>
  <text x="26" y="902" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">    SL301  Abstraction Inflation                     5  </tspan><tspan fill="#7d8590">advisory</tspan></text>
  <text x="26" y="922" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">    SL112  Placeholder Implementation                3  </tspan><tspan fill="#7d8590">defect</tspan></text>
  <text x="26" y="942" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">    SL110  Defensive Programming Noise               2  </tspan><tspan fill="#7d8590">maintainability</tspan></text>
  <text x="26" y="962" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">    SL111  Copy-Paste Drift                          2  </tspan><tspan fill="#7d8590">maintainability</tspan></text>
  <text x="26" y="982" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">    SL101  God Method                                1  </tspan><tspan fill="#7d8590">maintainability</tspan></text>
  <text x="26" y="1002" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">    SL103  Excessive Nesting                         1  </tspan><tspan fill="#7d8590">maintainability</tspan></text>
  <text x="26" y="1022" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">    SL105  Dead Private Method                       1  </tspan><tspan fill="#7d8590">defect</tspan></text>
  <text x="26" y="1042" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">    SL107  Swallowed Exception                       1  </tspan><tspan fill="#7d8590">defect</tspan></text>
  <text x="26" y="1062" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">    SL108  Redundant Condition                       1  </tspan><tspan fill="#7d8590">maintainability</tspan></text>
  <text x="26" y="1082" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">    SL109  Narrative Comment                         1  </tspan><tspan fill="#7d8590">maintainability</tspan></text>
  <text x="26" y="1102" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">    SL302  Empty Wrapper Class                       1  </tspan><tspan fill="#7d8590">advisory</tspan></text>
  <text x="26" y="1122" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">    SL303  Single-Use Abstraction                    1  </tspan><tspan fill="#7d8590">advisory</tspan></text>
  <text x="26" y="1142" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">    SL501  Unexplained Suppression                   1  </tspan><tspan fill="#7d8590">defect</tspan></text>
  <text x="26" y="1182" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#c9d1d9" font-weight="600">Next</tspan></text>
  <text x="26" y="1222" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">    </tspan><tspan fill="#56d4dd">→</tspan><tspan fill="#c9d1d9"> 12 findings have an automated fix: </tspan><tspan fill="#c9d1d9" font-weight="600">vendor/bin/sloppy fix</tspan></text>
  <text x="26" y="1242" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">    </tspan><tspan fill="#56d4dd">→</tspan><tspan fill="#c9d1d9"> No baseline yet. </tspan><tspan fill="#c9d1d9" font-weight="600">vendor/bin/sloppy baseline</tspan><tspan fill="#c9d1d9"> accepts these 31,</tspan></text>
  <text x="26" y="1262" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">      and every scan after it reports only new ones.</tspan></text>
  <text x="26" y="1282" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">    </tspan><tspan fill="#56d4dd">→</tspan><tspan fill="#c9d1d9"> </tspan><tspan fill="#c9d1d9" font-weight="600">vendor/bin/sloppy scan --all</tspan><tspan fill="#c9d1d9"> lists every finding; add </tspan><tspan fill="#c9d1d9" font-weight="600">--rule=SL104</tspan><tspan fill="#c9d1d9"> for one rule.</tspan></text>
  <text x="26" y="1322" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#7d8590">────────────────────────────────────────────────────────────</tspan></text>
  <text x="26" y="1362" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">  31 findings: </tspan><tspan fill="#e57373">6 high</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#e3b341">20 medium</tspan><tspan fill="#c9d1d9">  </tspan><tspan fill="#56d4dd">5 low</tspan></text>
  <text x="26" y="1402" font-size="13" xml:space="preserve"><tspan fill="#c9d1d9">  </tspan><tspan fill="#e57373" font-weight="600">✗ Failed</tspan><tspan fill="#c9d1d9"> — 6 finding(s) at high or above (fail_on: high)</tspan></text>
