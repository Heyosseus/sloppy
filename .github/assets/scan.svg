<svg xmlns="http://www.w3.org/2000/svg" width="817" height="1440" viewBox="0 0 817 1440" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, &quot;DejaVu Sans Mono&quot;, monospace">
