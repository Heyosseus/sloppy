name: 'Sloppy Agent Review'
description: 'Review a pull request for the debt AI coding agents leave behind: ranked annotations on the changed lines, a score delta, and a job summary.'
author: 'heyosseus'

branding:
  icon: 'alert-triangle'
  color: 'purple'

inputs:
  diff-branch:
    description: 'Revision to compare against. Defaults to the branch the pull request targets, or a whole-project scan on a push.'
    required: false
    default: ''
  paths:
    description: 'Space-separated paths to analyse instead of the configured ones.'
    required: false
    default: ''
  rules:
    description: 'Space-separated rule IDs to run, e.g. "SL101 SL107". Defaults to every enabled rule.'
    required: false
    default: ''
  fail-on:
    description: 'Lowest severity of NEW finding that fails the step: critical, high, medium, low, info, or never.'
    required: false
    default: 'high'
  min-confidence:
    description: 'Drop findings below this confidence (0-100).'
    required: false
    default: ''
  format:
    description: 'Report format. Defaults to github, which annotates the changed lines.'
    required: false
    default: 'github'
  report:
    description: 'Write the machine-readable report to this file as well.'
    required: false
    default: ''
  scan:
    description: 'Analyse the whole project instead of comparing against a revision.'
    required: false
    default: 'false'
  summary:
    description: 'Write the ranked report to the job summary.'
    required: false
    default: 'true'
  working-directory:
    description: 'Directory to run in, for a monorepo.'
    required: false
    default: '.'
  php-version:
    description: 'PHP version to set up. Set to "none" to use the PHP already on the runner.'
    required: false
    default: '8.3'
  version:
    description: 'Version of heyosseus/sloppy to install. Ignored when the project already has it as a dependency.'
    required: false
    default: '^1.6'

outputs:
  score:
    description: 'The slop score out of 100.'
    value: ${{ steps.sloppy.outputs.score }}
  score-delta:
    description: 'Change in the score against the base revision.'
    value: ${{ steps.sloppy.outputs.score-delta }}
  findings:
    description: 'Total findings reported.'
    value: ${{ steps.sloppy.outputs.findings }}
  new-findings:
    description: 'Findings this change introduced.'
    value: ${{ steps.sloppy.outputs.new-findings }}
  resolved-findings:
    description: 'Findings this change removed.'
    value: ${{ steps.sloppy.outputs.resolved-findings }}
  status:
    description: 'passed or failed, against fail-on.'
    value: ${{ steps.sloppy.outputs.status }}
  mode:
    description: 'diff or scan, depending on whether a base revision resolved.'
    value: ${{ steps.sloppy.outputs.mode }}

runs:
  using: 'composite'
  steps:
    - name: Set up PHP
      if: inputs.php-version != 'none'
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: mbstring, tokenizer
        coverage: none

    # Diff mode needs the target branch to exist locally. actions/checkout
    # fetches one commit by default, so the branch a pull request targets is
    # usually absent -- and a tool that silently scanned the whole project
    # instead would report inherited debt as if the author had written it.
    # The checkout is deepened too, so the merge base of the two is found.
    #
    # Every input reaches the shell through the environment, never through
    # `${{ }}` interpolation into the script: an input -- or a branch name --
    # containing `"; curl ... | sh; "` would otherwise be run as code.
    - name: Fetch the base branch
      if: github.base_ref != '' && inputs.scan != 'true'
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SLOPPY_BASE_REF: ${{ github.base_ref }}
      run: |
        git fetch --no-tags --depth=50 origin "$SLOPPY_BASE_REF" || true
        git fetch --no-tags --deepen=50 origin || true

    - name: Install Sloppy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SLOPPY_VERSION: ${{ inputs.version }}
      run: |
        if [ -x vendor/bin/sloppy ]; then
          echo "SLOPPY_BIN=vendor/bin/sloppy" >> "$GITHUB_ENV"
          exit 0
        fi

        composer global require "heyosseus/sloppy:$SLOPPY_VERSION" --no-interaction --no-progress
        echo "SLOPPY_BIN=$(composer global config home)/vendor/bin/sloppy" >> "$GITHUB_ENV"

    - name: Run Sloppy
      id: sloppy
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SLOPPY_DIFF_BRANCH: ${{ inputs.diff-branch }}
        SLOPPY_FAIL_ON: ${{ inputs.fail-on }}
        SLOPPY_FORMAT: ${{ inputs.format }}
        SLOPPY_REPORT: ${{ inputs.report }}
        SLOPPY_MIN_CONFIDENCE: ${{ inputs.min-confidence }}
        SLOPPY_SCAN: ${{ inputs.scan }}
        SLOPPY_SUMMARY: ${{ inputs.summary }}
        SLOPPY_PATHS: ${{ inputs.paths }}
        SLOPPY_RULES: ${{ inputs.rules }}
      run: |
        set -f
        args=()
        [ -n "$SLOPPY_DIFF_BRANCH" ] && args+=("--base=$SLOPPY_DIFF_BRANCH")
        [ -n "$SLOPPY_FAIL_ON" ] && args+=("--fail-on=$SLOPPY_FAIL_ON")
        [ -n "$SLOPPY_FORMAT" ] && args+=("--format=$SLOPPY_FORMAT")
        [ -n "$SLOPPY_REPORT" ] && args+=("--report=$SLOPPY_REPORT")
        [ -n "$SLOPPY_MIN_CONFIDENCE" ] && args+=("--min-confidence=$SLOPPY_MIN_CONFIDENCE")
        [ "$SLOPPY_SCAN" = "true" ] && args+=("--scan")
        [ "$SLOPPY_SUMMARY" != "true" ] && args+=("--no-summary")

        # Word-split on whitespace only; `set -f` keeps a `*` in a path
        # from being expanded against the runner's file system.
        read -r -a paths <<< "$SLOPPY_PATHS"
        read -r -a rules <<< "$SLOPPY_RULES"
        for path in "${paths[@]}"; do args+=("--path=$path"); done
        for rule in "${rules[@]}"; do args+=("--rule=$rule"); done

        "$SLOPPY_BIN" ci "${args[@]}"
